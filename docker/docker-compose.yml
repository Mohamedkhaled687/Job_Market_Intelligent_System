services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mongodb
    env_file:
      - path: ../.env
        required: false
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      # (OLLAMA_API_URL removed)
    ports:
      - "8000:8000"
    volumes:
      # Map the ChromaDB folder to persist Vector Embeddings
      - chroma_data:/app/chroma_db 
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "5173:5173"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "5173:5173"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
